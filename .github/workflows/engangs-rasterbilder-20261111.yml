name: Engangsgenerering av lokale redaksjonsbilder 11. november

on:
  push:
    branches:
      - bildebytte/redaksjonell-variasjon-2026-11-11
    paths:
      - .github/workflows/engangs-rasterbilder-20261111.yml

permissions:
  contents: write

jobs:
  rasteriser:
    runs-on: ubuntu-latest
    steps:
      - name: Hent utkastgrenen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer lokal grafikkmotor
        run: python -m pip install --disable-pip-version-check pillow cairosvg
      - name: Rasteriser tre egenproduserte SVG-grafikker og et verifisert arkivfoto
        shell: bash
        run: |
          python - <<'PY'
          import io, pathlib, hashlib, urllib.request
          from PIL import Image, ImageOps
          import cairosvg
          base=pathlib.Path("Bilder/Artikler")
          images=[
              ("2026-11-11-hegseth-votering-grafikk.svg", "2026-11-11-hegseth-votering-grafikk.webp"),
              ("2026-11-11-kraftnett-datasenter-grafikk.svg", "2026-11-11-kraftnett-datasenter-grafikk.webp"),
              ("2026-11-11-usa-valg-spillgrafikk.svg", "2026-11-11-usa-valg-spillgrafikk.webp")
          ]
          for src,dst in images:
              png=cairosvg.svg2png(url=str(base/src),output_width=1600,output_height=900)
              im=Image.open(io.BytesIO(png)).convert("RGB")
              target=base/dst
              im.save(target,format="WEBP",quality=85,method=6)
              print("Grafikk:",target, target.stat().st_size)
          url="https://upload.wikimedia.org/wikipedia/commons/c/cb/Munch_museet_T%C3%B8yen_18jun2005.jpg"
          request=urllib.request.Request(url,headers={"User-Agent":"Paradisavisa/1.0 (editorial image rights verification; contact via GitHub)"})
          with urllib.request.urlopen(request,timeout=35) as response:
              photo=response.read()
          sha1=hashlib.sha1(photo).hexdigest()
          expected="c01b527e1ec263ef76b7e36b371f7c4f5af3906f"
          if sha1!=expected:
              raise SystemExit("Photo checksum mismatch: "+sha1)
          im=Image.open(io.BytesIO(photo)).convert("RGB")
          im=ImageOps.fit(im,(1600,900),method=Image.Resampling.LANCZOS,centering=(0.56,0.50))
          target=base/"2026-11-11-gamle-munch-arkivfoto.webp"
          im.save(target,format="WEBP",quality=88,method=6)
          print("Foto:",target,target.stat().st_size,"original SHA1",sha1)
          PY
      - name: Legg verifiserte bilder i samme utkastgren
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bilder/Artikler/2026-11-11-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Rasteriser redaksjonell grafikk og lisensiert Munch-arkivfoto lokalt"
            git push origin HEAD:bildebytte/redaksjonell-variasjon-2026-11-11
          fi
