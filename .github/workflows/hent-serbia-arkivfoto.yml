name: Hent og verifiser lisensiert Serbia-arkivfoto

on:
  push:
    branches:
      - design/serbia-arkivfoto-20261103
    paths:
      - .github/workflows/hent-serbia-arkivfoto.yml

permissions:
  contents: write

jobs:
  hent-arkivfoto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer bildeverktøy
        run: python -m pip install --quiet Pillow
      - name: Hent Wikimedia-original med kontrollsum, og beskjær til 16:9
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps
          from io import BytesIO

          url = "https://upload.wikimedia.org/wikipedia/commons/5/5a/Studentski_protest_Novi_Sad_2025-02-01_-_7.jpg"
          expected_sha1 = "cd775ab4b32f7189856dba1d2d324e6c039fa542"
          request = Request(url, headers={"User-Agent":"Paradisavisa/1.0 (https://github.com/Paradispartiet/Paradisavisa)"})
          with urlopen(request, timeout=75) as response:
              data = response.read()
          digest = hashlib.sha1(data).hexdigest()
          if digest != expected_sha1:
              raise SystemExit(f"Originalfilens SHA1 stemmer ikke: {digest}")
          if len(data) < 1_000_000:
              raise SystemExit("Originalen ser ikke ut til å være fullstendig.")
          image = Image.open(BytesIO(data)).convert("RGB")
          if image.size != (4032,3024):
              raise SystemExit(f"Uventet originalstørrelse: {image.size}")
          hero = ImageOps.fit(image, (1600,900), method=Image.Resampling.LANCZOS, centering=(0.5,0.50))
          dest = Path("Bilder/Artikler/serbia-studentprotest-novi-sad-2025-arkivfoto.jpg")
          dest.parent.mkdir(parents=True, exist_ok=True)
          hero.save(dest, "JPEG", quality=88, optimize=True, subsampling=0)
          print(f"Verifisert Commons-original SHA1={digest}; lagret {dest} ({dest.stat().st_size} bytes)")
          PY
      - name: Lagre foto kun på arbeidsgrenen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bilder/Artikler/serbia-studentprotest-novi-sad-2025-arkivfoto.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Legg til lisensiert arkivfoto fra Novi Sad 2025"
          git push origin HEAD:refs/heads/design/serbia-arkivfoto-20261103
