<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" role="img" aria-labelledby="title description">
<title id="title">Taktisk forklaring: kollektivt høyt press sammenlignet med en mer skjermet spiss</title>
<desc id="description">To skjematiske fotballbaner sett ovenfra, ikke fra en ekte kamp. Venstre panel viser spissen og kantspillere som presser koordinert. Høyre panel viser en spiss som holder posisjonen høyt mens lagkameratene dekker mer rom. Illustrasjonen forklarer prinsippet, ikke dokumenterte løpsdata for Cristiano Ronaldo.</desc>
<rect width="1400" height="880" fill="#111514"/>
<text x="56" y="83" fill="#fff7e9" font-family="Georgia,serif" font-size="48" font-weight="700">Hva skjer når spissen ikke leder presset?</text>
<text x="58" y="130" fill="#cac7bc" font-family="Arial,sans-serif" font-size="24">Skjematiske roller – ikke sporingsdata fra en konkret Ronaldo-kamp</text>
<g font-family="Arial,sans-serif">
<text x="59" y="205" font-size="28" fill="#ffdc77" font-weight="700">A · Samordnet, høyt press</text>
<text x="755" y="205" font-size="28" fill="#ffdc77" font-weight="700">B · Spissen skjermes mer</text>
</g>
<g transform="translate(60 239)">
