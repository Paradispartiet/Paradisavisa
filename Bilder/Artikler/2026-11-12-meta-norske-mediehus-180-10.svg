<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc">
<title id="title">180 medieselskaper støttet aksjonen, ti sto bak begjæringen</title>
<desc id="desc">To tall med ulike definisjoner: Schibsted oppga at totalt 180 medieselskaper sto bak den norske aksjonen mot Metas vilkår. Ti navngitte medieselskaper fremmet begjæringen for Oslo tingrett. De ti er ikke 10 ekstra selskaper på toppen av de 180. Den midlertidige kjennelsen var ikke en endelig dom.</desc>
<rect width="1000" height="505" rx="16" fill="#111417"/>
<g font-family="system-ui,sans-serif">
<text x="37" y="54" fill="#ffe29a" font-size="27" font-weight="800">STØTTE ER IKKE DET SAMME SOM PARTSSTATUS</text>
<rect x="32" y="102" width="448" height="249" rx="12" fill="#202b32" stroke="#9ecbd8" stroke-width="3"/>
<rect x="520" y="102" width="448" height="249" rx="12" fill="#293027" stroke="#bbd28c" stroke-width="3"/>
<text x="64" y="205" fill="#c0ecf5" font-size="88" font-weight="850">180</text>
<text x="64" y="247" fill="#ffffff" font-size="22" font-weight="700">selskaper bak aksjonen</text>
<text x="64" y="283" fill="#d1dce0" font-size="18">oppgitt av Schibsted</text>
<text x="552" y="205" fill="#dff3b4" font-size="88" font-weight="850">10</text>
<text x="552" y="247" fill="#ffffff" font-size="22" font-weight="700">navngitte begjærende parter</text>
<text x="552" y="283" fill="#e0e5d7" font-size="18">omtalt i NTBs rettsreferat</text>
<rect x="32" y="378" width="936" height="91" rx="11" fill="#302a20"/>
<text x="54" y="409" fill="#ffe09d" font-size="19" font-weight="750">Tallene beskriver ulike roller – ikke to adskilte grupper.</text>
<text x="54" y="443" fill="#e6dccb" font-size="17">180 + 10 skal ikke summeres til 190. Utfallet er foreløpig.</text>
<text x="35" y="493" fill="#bebfc1" font-size="14">Kilder: Schibsted 29.10.2026 · NTB/Aftenposten 28.10.2026</text>
</g></svg>