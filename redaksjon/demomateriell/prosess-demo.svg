<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Illustrativ forklaringsgrafikk fra spørsmål til vedtak</title>
<desc id="desc">Tre bokser i en sammenhengende linje: undersøkelse, drøfting og beslutning. Dette er en redaksjonell skisse, ikke dokumentasjon av en bestemt sak.</desc>
<rect width="1200" height="675" fill="#14130f"/>
<text x="74" y="95" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#fff8eb">Slik kan en sak utvikle seg</text>
<text x="75" y="137" font-family="Arial,sans-serif" font-size="25" fill="#e6d1a6">Eksempel på redaksjonell forklaringsgrafikk</text>
<g stroke="#f8d25e" stroke-width="5" fill="none"><path d="M370 340H480M720 340H830"/><path d="m462 324 18 16-18 16M812 324l18 16-18 16"/></g>
<g font-family="Arial,sans-serif">
<rect x="75" y="225" width="295" height="230" rx="15" fill="#30281b" stroke="#e8c664" stroke-width="3"/>
<rect x="480" y="225" width="240" height="230" rx="15" fill="#30281b" stroke="#e8c664" stroke-width="3"/>
<rect x="830" y="225" width="295" height="230" rx="15" fill="#30281b" stroke="#e8c664" stroke-width="3"/>
<g fill="#ffdf86" font-size="25" font-weight="700"><text x="101" y="272">01</text><text x="508" y="272">02</text><text x="858" y="272">03</text></g>
<g fill="#ffffff" font-size="33" font-weight="700"><text x="101" y="333">Undersøkelse</text><text x="508" y="333">Drøfting</text><text x="858" y="333">Beslutning</text></g>
<g fill="#d7c8ad" font-size="21"><text x="101" y="379">Hva vet vi?</text><text x="508" y="379">Hvilke hensyn?</text><text x="858" y="379">Hva blir gjort?</text></g>
<text x="75" y="568" fill="#cbc1af" font-size="22">Ingen faktisk kommune eller avgjørelse er gjengitt her.</text>
</g>
</svg>