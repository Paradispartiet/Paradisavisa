<g transform="translate(835 273)">
<g>
<rect x="22" y="61" width="323" height="345" rx="12" fill="#27231e" stroke="#deb96d" stroke-width="5"/>
<path d="M56 145H308L280 185H84Z" fill="#ad9175"/>
<rect x="78" y="189" width="43" height="139" fill="#b3a084"/>
<rect x="162" y="189" width="43" height="139" fill="#b3a084"/>
<rect x="245" y="189" width="43" height="139" fill="#b3a084"/>
<rect x="55" y="333" width="252" height="27" fill="#998673"/>
<text x="185" y="31" text-anchor="middle" font-family="Georgia,serif" fill="#fff9ee" font-size="31" font-weight="700">Sentrum</text>
<text x="185" y="451" text-anchor="middle" font-family="Arial,sans-serif" fill="#fff0db" font-size="25" font-weight="700">Hovedscene</text>
<text x="185" y="488" text-anchor="middle" font-family="Arial,sans-serif" fill="#d3c8b5" font-size="21">tilbake</text>
</g>
<g transform="translate(390 0)">
<rect x="0" y="61" width="323" height="345" rx="12" fill="#18262b" stroke="#89afb7" stroke-width="5"/>
