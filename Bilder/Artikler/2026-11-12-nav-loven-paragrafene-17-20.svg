<svg xmlns="http://www.w3.org/2000/svg" width="960" height="630" viewBox="0 0 960 630" role="img" aria-labelledby="t d">
<title id="t">Fire sentrale bestemmelser i sosialtjenesteloven, paragrafene 17 til 20</title>
<desc id="d">Paragraf 17 gjelder råd og veiledning, 18 retten til livsoppholdsstønad når vilkårene er oppfylt, 19 stønad i særlige tilfeller og 20 mulige vilkår knyttet til innvilget støtte. Dette gir ikke en universell automatisk rett til alle de ekstraytelsene Paradisavisa foreslår. Reglene skal anvendes individuelt.</desc>
<rect width="960" height="630" rx="16" fill="#111518"/>
<g font-family="system-ui,sans-serif">
<text x="37" y="50" fill="#ffe08d" font-size="24" font-weight="800">DET LOVEN FAKTISK SIER</text>
<text x="37" y="82" fill="#d0d3cb" font-size="17">Sosialtjenesteloven · fire ulike bestemmelser</text>
<rect x="34" y="111" width="429" height="196" rx="12" fill="#20342e" stroke="#9bd7ba" stroke-width="2"/>
<rect x="495" y="111" width="429" height="196" rx="12" fill="#1f3140" stroke="#a2cced" stroke-width="2"/>
<rect x="34" y="327" width="429" height="196" rx="12" fill="#362f23" stroke="#e9c580" stroke-width="2"/>
<rect x="495" y="327" width="429" height="196" rx="12" fill="#35282d" stroke="#dda7bb" stroke-width="2"/>
<text x="55" y="164" fill="#b5eac7" font-size="27" font-weight="800">§ 17</text>
<text x="55" y="205" fill="#fff" font-size="20" font-weight="750">Råd og veiledning</text>
<text x="55" y="244" fill="#dbe9de" font-size="17">Kommunen skal gi hjelp til å løse</text>
<text x="55" y="268" fill="#dbe9de" font-size="17">eller forebygge sosiale problemer.</text>
<text x="516" y="164" fill="#b7daf4" font-size="27" font-weight="800">§ 18</text>
<text x="516" y="205" fill="#fff" font-size="20" font-weight="750">Stønad til livsopphold</text>
<text x="516" y="244" fill="#d8e3eb" font-size="17">Rett til økonomisk hjelp når</text>
<text x="516" y="268" fill="#d8e3eb" font-size="17">lovens vilkår er oppfylt.</text>
<text x="55" y="382" fill="#f2d29a" font-size="27" font-weight="800">§ 19</text>
<text x="55" y="423" fill="#fff" font-size="20" font-weight="750">Særlige tilfeller</text>
<text x="55" y="462" fill="#efe3cc" font-size="17">Kommunen kan også yte hjelp</text>
<text x="55" y="486" fill="#efe3cc" font-size="17">ved en vanskelig livssituasjon.</text>
<text x="516" y="382" fill="#eec2cf" font-size="27" font-weight="800">§ 20</text>
<text x="516" y="423" fill="#fff" font-size="20" font-weight="750">Vilkår</text>
<text x="516" y="462" fill="#ecdde2" font-size="17">Det kan settes lovlige,</text>
<text x="516" y="486" fill="#ecdde2" font-size="17">forholdsmessige vilkår.</text>
<text x="36" y="568" fill="#fff0c9" font-size="17" font-weight="700">Loven gir individuelle rettigheter – ikke alle foreslåtte faste tillegg automatisk.</text>
<text x="36" y="600" fill="#c3c7c5" font-size="15">Kilde: lovdata.no, sosialtjenesteloven kapittel 4 §§ 17–20.</text>
</g></svg>