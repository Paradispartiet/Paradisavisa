name: Paradisradioen – privat NB MOSS-Nano-lydprøve

on:
  pull_request:
    paths:
      - "scripts/radio/probe_moss_access.py"
      - "scripts/radio/test_probe_moss_access.py"
      - "scripts/radio/test_moss_pilot.py"
      - ".github/workflows/radio-moss-nano-privat.yml"
  workflow_dispatch:
    inputs:
      sample_date:
        description: "Dato for samme Vox-notisutvalg (Europe/Oslo)"
        required: true
        default: "2026-11-10"

permissions:
  contents: read

concurrency:
  group: paradisradio-nb-moss-nano-private
  cancel-in-progress: true

jobs:
  model-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Hent kildekoden uten legitimasjon
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test modeller, metadata og sperrer uten nedlasting
        run: |
          python -m unittest discover -s scripts/radio -p "test_probe_moss_access.py" -v
          python -m unittest discover -s scripts/radio -p "test_moss_pilot.py" -v

      - name: Kontroller offentlig modell- og vektfiltilgang før installasjon
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python scripts/radio/probe_moss_access.py --require-primary
          else
            python scripts/radio/probe_moss_access.py
          fi

  private-moss-voice:
    needs: model-access
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Hent notiser uten offentlig lyd eller publisering
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kontroller rettighetsport og testkodens sperrer
        run: |
          python -m unittest discover -s scripts/radio -p "test_moss_pilot.py" -v
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path("radio/release-gate.json").read_text(encoding="utf-8"))
          assert gate["publicAudioEnabled"] is False
          assert gate["modelRightsStatus"] == gate["editorialAudioStatus"] == "PENDING"
          PY

      - name: Krev hemmelig passord til kryptert privat lydpakke
        env:
          RADIO_MOSS_AUDIO_PASSPHRASE: ${{ secrets.RADIO_MOSS_AUDIO_PASSPHRASE }}
        run: |
          if [ "${#RADIO_MOSS_AUDIO_PASSPHRASE}" -lt 24 ]; then
            echo "::error::Mangler sterkt RADIO_MOSS_AUDIO_PASSPHRASE (minst 24 tegn). Offentlige Actions-artifakter kan leses utenfor redaksjonen."
            exit 1
          fi

      - name: Hent OpenMOSS-kode og dokumenter nøyaktig commit
        run: |
          git clone -q --depth 1 https://github.com/OpenMOSS/MOSS-TTS-Nano.git /tmp/moss-tts-nano
          sha="$(git -C /tmp/moss-tts-nano rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "MOSS_ENGINE_COMMIT=$sha" >> "$GITHUB_ENV"
          echo "MOSS motor-commit: $sha"

      - name: Installer CPU-motor og lydverktøy
        run: |
          python -m pip install --disable-pip-version-check \
            "torch==2.7.0+cpu" "torchaudio==2.7.0+cpu" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -e /tmp/moss-tts-nano
          python -m pip install --disable-pip-version-check \
            "huggingface_hub==0.36.0" "mutagen==1.47.0" \
            "WeTextProcessing>=1.0.4.1"
          ffmpeg -version | head -n 1

      - name: Lag maks to private, kildekoblede MP3-prøver
        env:
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
          HF_TOKEN: ${{ secrets.RADIO_HF_READ_TOKEN }}
        run: |
          python scripts/radio/lag_moss_prover.py \
            --date "${{ inputs.sample_date || '2026-11-10' }}" --count 2 --output moss-prove
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("moss-prove/rapport.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["audioCount"] == 2
          assert report["publicPlayable"] is False
          assert report["rightsApproved"] is False
          assert report["qualityApproved"] is False
          assert len(list(Path("moss-prove/lydproever").glob("*.mp3"))) == 2
          print("Private MP3-prøver validert – ingen ny offentlig radio")
          PY

      - name: Pakk og krypter privat lyd; fjern råfiler før opplasting
        env:
          RADIO_MOSS_AUDIO_PASSPHRASE: ${{ secrets.RADIO_MOSS_AUDIO_PASSPHRASE }}
        run: |
          tar -C moss-prove -czf /tmp/paradisradio-moss-prive.tar.gz rapport.json lydproever
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 300000 \
            -in /tmp/paradisradio-moss-prive.tar.gz \
            -out moss-prove/paradisradio-moss-prive.tar.gz.enc \
            -pass env:RADIO_MOSS_AUDIO_PASSPHRASE
          rm -f /tmp/paradisradio-moss-prive.tar.gz
          rm -rf moss-prove/lydproever moss-prove/rapport.json
          test -s moss-prove/paradisradio-moss-prive.tar.gz.enc

      - name: Lever bare kryptert Actions-artifakt (7 dager)
        uses: actions/upload-artifact@v4
        with:
          name: paradisradio-moss-nano-encrypted
          path: moss-prove/paradisradio-moss-prive.tar.gz.enc
          if-no-files-found: error
          retention-days: 7
