<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Hvem gjør hva? Et forslag til offentlig utvikling av grunnleggende varer og tjenester</title>
<desc id="svgdesc">Redaksjonell forklaringsgrafikk av Paradispartiets politiske forslag. Fire roller: folkevalgte beslutter mål og budsjett; offentlige fagmiljøer utvikler, tester og vedlikeholder; universiteter forsker og evaluerer uten å miste selvstendighet; brukere og uavhengige kontrollører stiller krav og gir tilbakemelding. Det beskriver ikke en eksisterende statlig ordning eller inngått samarbeid med Universitetet i Oslo.</desc>
<rect width="1600" height="900" fill="#101210"/>
<text x="82" y="95" fill="#fff7e9" font-family="Georgia,serif" font-weight="700" font-size="58">Hvem skal lage det offentlige alternativet?</text>
<text x="84" y="144" fill="#d1c9bb" font-family="Arial,sans-serif" font-size="25">Fire ulike roller i et politisk forslag – ikke en allerede vedtatt ordning</text>
<g font-family="Arial,sans-serif">
<rect x="82" y="198" width="673" height="244" rx="14" fill="#1e2c28" stroke="#8bb8a0" stroke-width="4"/>
<rect x="843" y="198" width="673" height="244" rx="14" fill="#26251c" stroke="#d7ba75" stroke-width="4"/>
<rect x="82" y="496" width="673" height="244" rx="14" fill="#1a2830" stroke="#85aec4" stroke-width="4"/>
<rect x="843" y="496" width="673" height="244" rx="14" fill="#2d2228" stroke="#d59aaf" stroke-width="4"/>
<g font-size="24" font-weight="700">
<text x="121" y="247" fill="#a6d8ba">1 · FOLKEVALGTE</text>
<text x="882" y="247" fill="#f3d08c">2 · OFFENTLIGE FAGMILJØER</text>
<text x="121" y="545" fill="#abd3ec">3 · UNIVERSITETER OG FORSKERE</text>
<text x="882" y="545" fill="#f0bac9">4 · BRUKERE OG KONTROLL</text>
</g>
<g fill="#fff8eb" font-size="37" font-weight="700">
<text x="121" y="303">Bestemmer mål og rammer</text>
<text x="882" y="303">Bygger og drifter</text>
<text x="121" y="601">Forskning og evaluering</text>
<text x="882" y="601">Tester og stiller krav</text>
</g>
<g fill="#ded7c9" font-size="25">
<text x="121" y="350">Demokratisk prioritering, finansiering</text>
<text x="121" y="382">og innsyn i ressursbruken</text>
<text x="882" y="350">Produktdesign, reparasjon, sikkerhet</text>
<text x="882" y="382">og ansvar for langvarig vedlikehold</text>
<text x="121" y="648">Uavhengig faglig kontroll, forskning</text>
<text x="121" y="680">og kunnskapsdeling – ikke fabrikkdrift</text>
<text x="882" y="648">Tilgjengelighet, brukertilbakemeldinger</text>
<text x="882" y="680">og uavhengig kvalitetskontroll</text>
</g>
