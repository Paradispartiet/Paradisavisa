name: Paradisavisa – daglig redaksjonell notisstatus

on:
  schedule:
    # 07:15 UTC = 08:15 norsk vintertid / 09:15 norsk sommertid.
    # Dette sjekker bare kilder/metadata i notiser.json, ikke eksterne nyheter.
    - cron: "15 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "notiser.json"
      - "scripts/notisstatus.cjs"
      - "scripts/notisstatus.test.cjs"
      - ".github/workflows/daglig-notisstatus.yml"
  push:
    branches: [main]
    paths:
      - "notiser.json"
      - "scripts/notisstatus.cjs"
      - "scripts/notisstatus.test.cjs"
      - ".github/workflows/daglig-notisstatus.yml"

permissions:
  contents: read

concurrency:
  group: notisstatus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  redaksjonell-status:
    name: Les metadata og lag redaksjonell statusrapport
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Hent bare kildefilene
        uses: actions/checkout@v4
      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test notisstatus, dato, kildekontroll og utløp
        run: node --test scripts/notisstatus.test.cjs
      - name: Lag rapport i GitHub Actions-sammendraget
        run: node scripts/notisstatus.cjs
