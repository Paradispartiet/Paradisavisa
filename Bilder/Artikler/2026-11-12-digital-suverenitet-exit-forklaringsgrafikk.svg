<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="svgt svgdesc">
<title id="svgt">Hva må fungere for at en offentlig virksomhet skal kunne bytte teknologileverandør?</title>
<desc id="svgdesc">En redaksjonell forklaringsgrafikk, ikke en offisiell sjekkliste eller et resultat fra en virkelig kommunetest. Fire områder må vurderes: data og filformater, identitet og tilgang, programmer og integrasjoner, og drift og beredskap. Et leverandørbytte fungerer ikke nødvendigvis bare fordi data kan eksporteres.</desc>
<rect width="1600" height="900" fill="#101411"/>
<g><rect x="40" y="38" width="1520" height="824" fill="none" stroke="#38473e" stroke-width="2" rx="20"/></g>
<text x="78" y="113" font-family="Georgia,serif" font-weight="700" font-size="56" fill="#fff8ed">Kan kommunen faktisk bytte leverandør?</text>
<text x="80" y="167" font-family="Arial,sans-serif" font-size="27" fill="#d4cbbb">Fire avhengigheter som må testes – også etter at filene er eksportert</text>
<g><rect x="80" y="250" width="310" height="356" rx="18" fill="#1b2221" stroke="#9ec9c2" stroke-width="3"/>
<text x="108" y="316" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#9ec9c2">01</text>
<text x="106" y="365" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#9ec9c2">DATA OG FILFORMATER</text>
<line x1="106" x2="361" y1="395" y2="395" stroke="#56615b" stroke-width="2"/>
<text x="106" y="455" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">Kan dokumenter og databaser</text>
<text x="106" y="491" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">eksporteres og leses andre steder?</text>
<text x="106" y="570" font-family="Arial,sans-serif" font-size="19" fill="#b9baae">Må testes i praksis</text>
</g>
<g><rect x="456" y="250" width="310" height="356" rx="18" fill="#1b2221" stroke="#ebd085" stroke-width="3"/>
<text x="484" y="316" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#ebd085">02</text>
<text x="482" y="365" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#ebd085">IDENTITET OG TILGANG</text>
<line x1="482" x2="737" y1="395" y2="395" stroke="#56615b" stroke-width="2"/>
<text x="482" y="455" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">Kan brukere og rettigheter</text>
<text x="482" y="491" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">flyttes uten å miste kontroll?</text>
<text x="482" y="570" font-family="Arial,sans-serif" font-size="19" fill="#b9baae">Må testes i praksis</text>
</g>
<g><rect x="832" y="250" width="310" height="356" rx="18" fill="#1b2221" stroke="#e7aa8f" stroke-width="3"/>
<text x="860" y="316" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#e7aa8f">03</text>
<text x="858" y="365" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#e7aa8f">PROGRAM OG INTEGRASJON</text>
<line x1="858" x2="1113" y1="395" y2="395" stroke="#56615b" stroke-width="2"/>
<text x="858" y="455" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">Kan tjenester og koblinger</text>
<text x="858" y="491" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">fortsette hos en ny aktør?</text>
<text x="858" y="570" font-family="Arial,sans-serif" font-size="19" fill="#b9baae">Må testes i praksis</text>
</g>
<g><rect x="1208" y="250" width="310" height="356" rx="18" fill="#1b2221" stroke="#cbb5e3" stroke-width="3"/>
<text x="1236" y="316" font-family="Arial,sans-serif" font-size="42" font-weight="800" fill="#cbb5e3">04</text>
<text x="1234" y="365" font-family="Arial,sans-serif" font-size="22" font-weight="800" fill="#cbb5e3">DRIFT OG BEREDSKAP</text>
<line x1="1234" x2="1489" y1="395" y2="395" stroke="#56615b" stroke-width="2"/>
<text x="1234" y="455" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">Er det avtaler, kompetanse</text>
<text x="1234" y="491" font-family="Arial,sans-serif" font-size="23" fill="#f5f0e7">og en realistisk plan B?</text>
<text x="1234" y="570" font-family="Arial,sans-serif" font-size="19" fill="#b9baae">Må øves og vedlikeholdes</text>
</g>
<g stroke="#fff0cd" stroke-width="5" fill="none" stroke-linecap="round">
<path d="M400 425H450M440 414L451 425L440 436"/>
<path d="M777 425H827M817 414L828 425L817 436"/>
<path d="M1153 425H1203M1193 414L1204 425L1193 436"/>
</g>
<rect x="80" y="671" width="1438" height="112" fill="#253129" rx="10" stroke="#748c76" stroke-width="2"/>
<text x="112" y="718" font-family="Georgia,serif" font-weight="700" font-size="30" fill="#fff4df">En vellykket eksport er ikke det samme som en vellykket overgang.</text>
<text x="112" y="755" font-family="Arial,sans-serif" font-size="22" fill="#d6dccf">Test kostnad, sikkerhet, ansvar og kontinuitet på tvers av alle fire områdene.</text>
<text x="83" y="829" font-family="Arial,sans-serif" font-size="18" fill="#bfb7aa">Faglig grunnlag: Digdir / Skates «Skiftende skydekke» (2026). Firefeltsmodellen er Paradisavisas redaksjonelle forenkling.</text>
</svg>