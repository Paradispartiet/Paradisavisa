<svg xmlns="http://www.w3.org/2000/svg" width="940" height="568" viewBox="0 0 940 568" role="img" aria-labelledby="t d">
<title id="t">Brent-oljens sluttkurser 2.–10. november 2026</title>
<desc id="d">Kurve for januar-kontraktens oppgjørspris i dollar per fat ved sju handelsdager. 2. november 104,77; 3. november 103,60; 4. november 94,62; 5. november 98,29; 6. november 98,32; 9. november 92,57; 10. november 91,49. Disse er sluttkurser, ikke intradagsobservasjoner eller en prognose. Nullpunktet er ikke vist; y-aksen går fra 85 til 110 dollar.</desc>
