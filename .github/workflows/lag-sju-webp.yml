name: Sju originalbilder – bygg WebP til artikkelutkast

on:
  push:
    branches:
      - redaksjon/sju-originalbilder-20261112
    paths:
      - 'redaksjon/illustrasjoner/2026-11-12/*-original.svg'
      - 'scripts/generer-sju-artikkelbilder.py'
      - '.github/workflows/lag-sju-webp.yml'

permissions:
  contents: write

concurrency:
  group: sju-artikkelbilder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lag-kandidater:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Hent bildenes arbeidsgren
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer lokale bildeverktøy
        run: python -m pip install 'Pillow>=10,<13' 'CairoSVG>=2,<3'
      - name: Produser og kontroller syv 16:9 WebP-kandidater
        run: python scripts/generer-sju-artikkelbilder.py
      - name: Bevar kandidatenes originalfiler som kjøreartifakt
        uses: actions/upload-artifact@v4
        with:
          name: paradisavisa-sju-bildekandidater
          path: |
            utkast/2026-11-12/bilder/*.webp
            redaksjon/illustrasjoner/2026-11-12/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit resultatene bare til bildenes arbeidsgren
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utkast/2026-11-12/bilder/*.webp redaksjon/illustrasjoner/2026-11-12/manifest.json
          if git diff --cached --quiet; then
            echo 'Bildekandidatene er allerede identiske.'
          else
            git commit -m 'Generer sju dokumenterte WebP-kandidater [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          echo 'Bildene er bare utkast, ikke lagt i offentlige nyhetsstrømmer.' >> "$GITHUB_STEP_SUMMARY"
