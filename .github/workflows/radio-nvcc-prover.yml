name: Paradisradioen – norsk NVCC-stemmesammenligning

on:
  pull_request:
    paths:
      - "scripts/radio/generer_nvcc_prover.py"
      - "scripts/radio/test_nvcc_voice_unit.py"
      - ".github/workflows/radio-nvcc-prover.yml"
      - "radio/nvcc-evaluering.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvcc-lydprover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privat-nvcc-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Klargjør Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kontroller kilder, modellkort og publiseringssperre uten nedlasting
        run: python -m unittest discover -s scripts/radio -p "test_*.py" -v

      - name: Installer låste lydverktøy uten betalt TTS
        run: |
          python -m pip install --disable-pip-version-check \
            "piper-tts==1.8.0" "huggingface_hub==0.36.0" \
            "mutagen==1.47.0" "imageio-ffmpeg==0.6.0"
          python - <<'PY'
          import imageio_ffmpeg
          import os
          from pathlib import Path
          exe = Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert exe.is_file()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as file:
              file.write("RADIO_FFMPEG_EXECUTABLE=" + str(exe) + "\n")
          print("FFmpeg tilgjengelig som låst Python-pakke")
          PY

      - name: Hent nøyaktig NVCC-modell fra dokumentert revisjon
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          repo = "rhasspy/piper-voices"
          revision = "e7229f7d33a10e145e109b886d661984201ac3c4"
          base = "no/no_NO/nvcc/medium"
          names = ["no_NO-nvcc-medium.onnx", "no_NO-nvcc-medium.onnx.json", "MODEL_CARD"]
          for name in names:
              p = Path(hf_hub_download(
                  repo_id=repo, filename=base + "/" + name, revision=revision,
                  local_dir="nvcc-modell"
              ))
              assert p.is_file()
          print("Modell og kildekort hentet fra fast Hugging Face-commit:", revision)
          PY

      - name: Generer seks private lytteprøver med to norske stemmer
        run: |
          python scripts/radio/generer_nvcc_prover.py \
            --model-root nvcc-modell --output nvcc-prove --count 3
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("nvcc-prove/rapport.json").read_text(encoding="utf-8"))
          assert report["sampleCount"] == 3
          assert report["audioCount"] == 6
          assert report["publicPlayable"] is False
          assert report["qualityApproved"] is False
          assert {a["speaker"] for a in report["samples"]} == {"KNN", "MNN"}
          assert all(a["codec"] == "mp3" and a["sampleRate"] == 22050
                     for a in report["samples"])
          assert len(list(Path("nvcc-prove/lydproever").glob("*.mp3"))) == 6
          print("Alle seks MP3-filer bestått; ingen offentlig publisering")
          PY

      - name: Lagre private A/B-lydprøver med kort retensjon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradisradio-nvcc-a-b-prover
          path: |
            nvcc-prove/rapport.json
            nvcc-prove/lydproever/*.mp3
          if-no-files-found: warn
          retention-days: 7
