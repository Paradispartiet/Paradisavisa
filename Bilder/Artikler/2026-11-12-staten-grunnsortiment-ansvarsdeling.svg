<path d="M1179 447V489M1167 477L1179 489L1191 477" fill="none" stroke="#fff0c7" stroke-width="5" stroke-linecap="round"/>
<path d="M832 620H768M780 608L768 620L780 632" fill="none" stroke="#fff0c7" stroke-width="5" stroke-linecap="round"/>
</g>
<line x1="82" x2="1516" y1="793" y2="793" stroke="#676158" stroke-width="2"/>
<text x="82" y="832" fill="#c9c1b4" font-family="Arial,sans-serif" font-size="22">Kilde: Paradispartiets kommentar «Staten bør lage ting som varer» (6.11.2026).</text>
<text x="82" y="864" fill="#c9c1b4" font-family="Arial,sans-serif" font-size="22">Illustrativ ansvarsdeling. Ingen av produktene eller samarbeidsavtalene er dokumentert som etablert.</text>
</svg>