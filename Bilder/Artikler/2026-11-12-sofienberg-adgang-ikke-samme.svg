<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-labelledby="t d">
<title id="t">Tre former for tilgang til et kulturhus: betalt aktivitet, gratis aktivitet og fri oppholdsrett</title>
<desc id="d">Tre prinsipielt forskjellige former for adgang. Betalt aktivitet gir plass til en aktivitet etter betaling. Gratis arrangement gir gratis adgang på et bestemt tidspunkt, men er fremdeles programmert. Fri uorganisert oppholdstid betyr å kunne komme uten kjøp, påmelding eller aktivitet i faste annonserte tidsrom. Det tredje er et forslag fra Paradisavisa og ikke et dokumentert tilbud i Sofienberg kirke per 12. november 2026.</desc>
<rect width="960" height="590" rx="16" fill="#131518"/>
<g font-family="system-ui,sans-serif">
<text x="32" y="50" fill="#ffe18e" font-size="24" font-weight="800">ÅPEN DØR – MEN PÅ HVILKE VILKÅR?</text>
<text x="32" y="79" fill="#d5d8d0" font-size="16">Ulike grader av tilgjengelighet – ikke en vurdering av hvem som er velkommen som person</text>
<rect x="27" y="112" width="288" height="347" rx="12" stroke="#a6cbda" stroke-width="3" fill="#20303a"/>
<rect x="336" y="112" width="288" height="347" rx="12" stroke="#b7d9ab" stroke-width="3" fill="#28342b"/>
<rect x="645" y="112" width="288" height="347" rx="12" stroke="#f0cf78" stroke-width="3" fill="#332e20"/>
<text x="48" y="163" fill="#c7e4f1" font-size="21" font-weight="800">BETALT AKTIVITET</text>
<text x="355" y="163" fill="#d6f0c8" font-size="21" font-weight="800">GRATIS ARRANGEMENT</text>
<text x="663" y="163" fill="#ffe3a8" font-size="21" font-weight="800">FRITT OPPHOLD</text>
<text x="48" y="219" fill="#f8f9f5" font-size="19">Billetter / deltakerpris</text>
<text x="48" y="248" fill="#d3dbe0" font-size="17">Program og tidspunkt</text>
<text x="48" y="279" fill="#d3dbe0" font-size="17">Eksempel: yoga</text>
<text x="356" y="219" fill="#f8f9f5" font-size="19">Ingen billettpris</text>
<text x="356" y="248" fill="#d7e3d5" font-size="17">Program og tidspunkt</text>
<text x="356" y="279" fill="#d7e3d5" font-size="17">Eksempel: gratis konsert</text>
<text x="664" y="219" fill="#f8f9f5" font-size="19">Ingen kjøpsplikt</text>
<text x="664" y="248" fill="#e5ddc7" font-size="17">Ingen aktivitetsplikt</text>
<text x="664" y="279" fill="#e5ddc7" font-size="17">Faste åpne tidsrom</text>
<rect x="669" y="336" width="235" height="66" rx="7" fill="#f0cf78"/>
<text x="785" y="360" fill="#262317" font-size="16" font-weight="800" text-anchor="middle">PARADISAVISAS</text>
<text x="785" y="382" fill="#262317" font-size="16" font-weight="800" text-anchor="middle">FORSLAG</text>
<text x="33" y="497" fill="#f3e8be" font-size="18" font-weight="700">Gratis konsert og åpen varmestue er ikke samme ordning.</text>
<text x="33" y="532" fill="#d9d5ca" font-size="15">Modellen beskriver adgangsformer – den sier ikke at fast varmestue mangler.</text>
<text x="33" y="557" fill="#c4bfad" font-size="15">Kildegrunnlag: Sofienbergprosjektets aktivitetsprogram og Paradisavisas kommentar.</text>
</g></svg>