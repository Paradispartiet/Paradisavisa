name: Kontroll av publisert Støre–Stubb-sak

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kontroller-store-stubb-publisering.yml"
      - "artikler/2026-11-02-store-stubb-diplomatisk-mulighet.html"
      - "Bilder/Artikler/store-stubb-geopolitisk-1600x900.jpg"
      - "Nyhetshjul.json"
      - "kommentarer.json"

permissions:
  contents: read

jobs:
  kontroller-nettside:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sjekk offentlig GitHub Pages, ikke bare GitHub-koden
        shell: bash
        run: |
          set -euo pipefail
          base="https://paradispartiet.github.io/Paradisavisa"
          artikkel="$base/artikler/2026-11-02-store-stubb-diplomatisk-mulighet.html"
          for forsok in $(seq 1 18); do
            echo "Kontroll $forsok: $artikkel"
            url="$artikkel?kontroll=${GITHUB_RUN_ID}-$forsok"
            status=$(curl -L -sS -o /tmp/paradisartikkel.html -w '%{http_code}' --max-time 25 "$url" || true)
            echo "Artikkelens HTTP-status: $status"
            if [ "$status" = "200" ] && grep -Fq 'Støre–Stubb: Den diplomatiske muligheten' /tmp/paradisartikkel.html; then
              for fil in Nyhetshjul.json kommentarer.json; do
                curl --fail -L -sS --max-time 25 "$base/$fil?kontroll=${GITHUB_RUN_ID}-$forsok" -o "/tmp/$fil"
                grep -Fq 'artikler/2026-11-02-store-stubb-diplomatisk-mulighet.html' "/tmp/$fil"
              done
              curl --fail -L -sS --max-time 25 "$base/Bilder/Artikler/store-stubb-geopolitisk-1600x900.jpg?kontroll=${GITHUB_RUN_ID}-$forsok" -o /tmp/illustrasjon.jpg
              test "$(wc -c </tmp/illustrasjon.jpg)" -gt 30000
              grep -Fq 'Bilder/Artikler/store-stubb-geopolitisk-1600x900.jpg' /tmp/paradisartikkel.html
              for fil in Nyhetshjul.json kommentarer.json; do
                grep -Fq 'Bilder/Artikler/store-stubb-geopolitisk-1600x900.jpg' "/tmp/$fil"
              done
              echo "OK: Artikkel, JPEG-hovedbilde og begge forsidehenvisningene er offentlig tilgjengelige."
              exit 0
            fi
            echo "Ikke synlig ennå. Sjekker på nytt."
            sleep 25
          done
          echo "FEIL: Artikkelen er ikke tilgjengelig på det offentlige nettstedet."
          exit 1
