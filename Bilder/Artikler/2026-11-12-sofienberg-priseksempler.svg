<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="t d">
<title id="t">Tre arrangementer i Sofienberg kirke med ulike priser: 0, 50 og 150 kroner</title>
<desc id="d">Tre faktiske eksempler fra 6. og 7. november 2026: Oslo Kammerkor gratis konsert 7. november, Kor På Sparket til 50 kroner 6. november og nabolagsyoga til 150 kroner 6. november. Prisene er dokumenterte priseksempler, ikke gjennomsnittet av Sofienbergprosjektets tilbud. Gratis arrangement er ikke det samme som et uorganisert oppholdsrom som er åpent hele dagen.</desc>
<rect width="960" height="650" rx="16" fill="#121518"/>
<g font-family="system-ui,sans-serif">
<text x="38" y="50" fill="#ffe08d" font-size="25" font-weight="800">TRE EKSEMPLER PÅ ADGANG</text>
<text x="38" y="80" fill="#e0e3db" font-size="17">Konkret annonsert pris i kirken · 6.–7. november 2026</text>
<line x1="39" y1="142" x2="39" y2="515" stroke="#66685d" stroke-width="2"/>
<text x="41" y="151" fill="#f6f6f3" font-size="19" font-weight="750">Oslo Kammerkor</text>
<text x="41" y="178" fill="#d5d8d1" font-size="15">7. november · gratis konsert</text>
<rect x="41" y="202" width="3" height="45" rx="2" fill="#b7e1b7"/>
<circle cx="44" cy="225" r="10" fill="#c1f1c1"/>
<text x="76" y="237" fill="#fff" font-size="28" font-weight="800">0 kr</text>
<text x="41" y="309" fill="#f6f6f3" font-size="19" font-weight="750">Kor På Sparket</text>
<text x="41" y="337" fill="#d5d8d1" font-size="15">6. november · deltakelse</text>
<rect x="41" y="357" width="273" height="47" rx="6" fill="#8cc6e0"/>
<text x="336" y="393" fill="#fff" font-size="28" font-weight="800">50 kr</text>
<text x="41" y="469" fill="#f6f6f3" font-size="19" font-weight="750">Nabolagsyoga</text>
<text x="41" y="496" fill="#d5d8d1" font-size="15">6. november · deltakelse</text>
<rect x="41" y="517" width="818" height="47" rx="6" fill="#f1d27b"/>
<text x="750" y="554" text-anchor="end" fill="#20211e" font-size="28" font-weight="800">150 kr</text>
<text x="38" y="607" fill="#ddd6c9" font-size="15">Ulike arrangementer – ikke komplett oversikt eller gjennomsnittspris.</text>
<text x="38" y="628" fill="#b7bab4" font-size="14">Kilder: Sofienbergprosjektets egne arrangementsider, hentet 12.11.2026.</text>
</g></svg>