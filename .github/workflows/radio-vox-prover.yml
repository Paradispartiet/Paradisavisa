name: Paradisradioen – bokmålsstemme Vox-prøve

on:
  pull_request:
    paths:
      - "scripts/radio/generer_vox_prover.py"
      - "radio/vox-model-lock.json"
      - "scripts/radio/test_vox_pilot.py"
      - "scripts/radio/lag_lyttepanel.py"
      - "scripts/radio/test_lag_lyttepanel.py"
      - "scripts/radio/lag_mobil_lyttepanel.py"
      - "scripts/radio/test_lag_mobil_lyttepanel.py"
      - ".github/workflows/radio-vox-prover.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paradisradio-vox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  norsk-lydprove:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Hent godkjente notiser, uten publisering
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sjekk nye stemmetester og eksisterende publiseringssperrer
        run: python -m unittest discover -s scripts/radio -p "test_*.py" -v

      - name: Installer gratis Piper og MP3-verktøy
        run: |
          python -m pip install --disable-pip-version-check \
            "piper-tts==1.8.0" "huggingface_hub==0.36.0" \
            "imageio-ffmpeg==0.6.0" "mutagen==1.47.0"
          python - <<'PY'
          import os
          import imageio_ffmpeg
          from pathlib import Path
          exe = Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert exe.exists()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("RADIO_FFMPEG_EXECUTABLE=" + str(exe) + "\n")
          PY

      - name: Lås og hent norsk Vox-modell til intern prøvelytting
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          sys.path.insert(0, "scripts/radio")
          from generer_vox_prover import load_lock
          lock = load_lock()
          gate = json.loads(Path("radio/release-gate.json").read_text(encoding="utf-8"))
          if (gate.get("publicAudioEnabled") is not False
                  or gate.get("modelRightsStatus") != "PENDING"
                  or gate.get("editorialAudioStatus") != "PENDING"):
              raise RuntimeError("Privat Vox-jobb krever sperret offentlig lydport")
          for name, wanted in lock["files"].items():
              path = Path(hf_hub_download(
                  repo_id=lock["repository"], filename=name,
                  revision=lock["revision"], local_dir="vox-modell"
              ))
              if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != wanted:
                  raise RuntimeError("Nedlastet Vox-stemme avviker fra prøvelyttet fil: " + name)
              print(name, path.stat().st_size, "bytes – SHA-256 OK")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("VOX_MODEL_REVISION=" + lock["revision"] + "\n")
          print("Låst modellrevisjon:", lock["revision"])
          PY

      - name: Generer fire private nyhetsopplesninger med to flytprofiler
        run: |
          python scripts/radio/generer_vox_prover.py \
            --model-root vox-modell --revision "$VOX_MODEL_REVISION" \
            --count 2 --output vox-prove
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("vox-prove")
          report = json.loads((p / "rapport.json").read_text(encoding="utf-8"))
          assert report["audioCount"] == 4
          assert report["sampleCount"] == 2
          assert report["publicPlayable"] is False
          assert report["rightsApproved"] is False
          assert report["qualityApproved"] is False
          assert {r["profile"] for r in report["samples"]} == {"normal", "nyhetsflyt"}
          assert all(r["codec"] == "mp3" and r["durationSeconds"] > 2 for r in report["samples"])
          assert len(list((p / "lydproever").glob("*.mp3"))) == 4
          print("Fire kontrollerte MP3-prøver, kun som upublisert Actions-artifakt")
          PY

      - name: Lag samlet lyttepanel som virker uten separate MP3-lenker
        run: |
          python scripts/radio/lag_lyttepanel.py --report vox-prove/rapport.json --output vox-prove/lyttepanel.html
          test -s vox-prove/lyttepanel.html
          grep -q "data:audio/mpeg;base64," vox-prove/lyttepanel.html
          echo "Offline HTML med fire innbakte lydprøver er klar"

      - name: Lag mobiltestpanel med Media Session og lokal testlogg
        run: |
          python scripts/radio/lag_mobil_lyttepanel.py --report vox-prove/rapport.json --output vox-prove/ipad-mobiltest.html
          test -s vox-prove/ipad-mobiltest.html
          grep -q "data:audio/mpeg;base64," vox-prove/ipad-mobiltest.html
          grep -q "setActionHandler" vox-prove/ipad-mobiltest.html
          echo "Én MP3-spiller, offline test og mediekontroller er klar"

      - name: Lever intern lydpakke i syv dager, ikke GitHub Pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paradisradio-vox-bokmaal-prover
          path: |
            vox-prove/rapport.json
            vox-prove/lyttepanel.html
            vox-prove/ipad-mobiltest.html
            vox-prove/lydproever/*.mp3
          if-no-files-found: warn
          retention-days: 7
