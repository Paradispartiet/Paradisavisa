<rect x="65" y="370" width="470" height="40" rx="6" fill="#0d2921" opacity=".96"/>
<text x="300" y="397" text-anchor="middle" fill="#d9f4e7" font-size="20" font-family="Arial,sans-serif">Flere av de første løpene faller på andre</text>
</g>
<g font-family="Arial,sans-serif" fill="#d8d3c8" font-size="22">
<text x="63" y="776">Gult = angripende lag  ·  Lys blågrått = motspillere  ·  Piler = illustrative pressløp</text>
<text x="63" y="820">Kontekst: Ralf Rangnicks uttalelser om Manchester Uniteds presspill i mai 2022.</text>
<text x="63" y="854">Dette er en taktisk modell, ikke bevis for hvordan en konkret spiller beveget seg.</text>
</g>
