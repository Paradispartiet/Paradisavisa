<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Et solid offentlig grunnsortiment</title>
<desc id="desc">Symbolmettet illustrasjon av fjernsyn, mobiltelefon, datamaskin, verktøy, dokumenter og kunnskapsnettverk, bundet sammen av en lysende felles struktur på mørk bakgrunn.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1420"/><stop offset=".55" stop-color="#080a0e"/><stop offset="1" stop-color="#15110c"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b2"/><stop offset=".38" stop-color="#ffd45e"/><stop offset="1" stop-color="#b4812a"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24364d"/><stop offset=".55" stop-color="#132134"/><stop offset="1" stop-color="#11151d"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="8"/></filter><pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#b5a579" stroke-opacity=".12" stroke-width="1"/></pattern></defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#grid)"/>
<circle cx="800" cy="450" r="340" fill="#cca14c" opacity=".07" filter="url(#glow)"/><g stroke="#d8bd77" stroke-width="3" opacity=".45" fill="none"><path d="M440 265L800 130L1160 265L1300 540L1015 746L580 746L300 540Z"/><path d="M800 130L800 770M300 540L1300 540M440 265L1160 265M580 746L1160 265M1015 746L440 265"/></g>
