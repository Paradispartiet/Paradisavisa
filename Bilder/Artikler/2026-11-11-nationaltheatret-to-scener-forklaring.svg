<path d="M51 179H273M51 207H273M51 235H273M51 263H273M51 291H273" stroke="#648994" stroke-width="5"/>
<path d="M111 155V329M181 155V329M247 155V329" stroke="#648994" stroke-width="5"/>
<text x="160" y="31" text-anchor="middle" font-family="Georgia,serif" fill="#fff9ee" font-size="31" font-weight="700">Tøyen</text>
<text x="160" y="451" text-anchor="middle" font-family="Arial,sans-serif" fill="#fff0db" font-size="25" font-weight="700">Permanente biscener</text>
<text x="160" y="488" text-anchor="middle" font-family="Arial,sans-serif" fill="#d3c8b5" font-size="21">etter planen</text>
