<rect x="80" y="810" width="1440" height="3" fill="#615b51"/>
<text x="80" y="854" fill="#c9c2b6" font-family="Arial,sans-serif" font-size="22">Kilde: Kultur- og likestillingsdepartementet, 10.11.2026. Skjematisk illustrasjon – ikke bygg- eller scenetegning.</text>
</svg>