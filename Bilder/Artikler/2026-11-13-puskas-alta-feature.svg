<title id="ttl">Musikk som samler – redaksjonell illustrasjon til Puskas-feature</title>
<desc id="desc">En stor vinylplate på en platespiller i forgrunnen, varme lys fra en platebar og antydninger til nordlys og Alta i bakgrunnen. Original illustrasjon, ikke et foto av Puskas.</desc>
