<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" width="1400" height="788" role="img" aria-labelledby="title desc">
<title id="title">Fritt valg mellom NAV-kontorer</title>
<desc id="desc">En innbygger står ved to lysende gangveier som fører til hvert sitt NAV-kontor i en stilisert norsk by. Bildet illustrerer retten til å velge hvor man får personlig hjelp, ikke et bestemt NAV-kontor.</desc>
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#071524"/><stop offset=".47" stop-color="#29445b"/><stop offset="1" stop-color="#d89c62"/></linearGradient>
 <radialGradient id="sunset" cx=".5" cy=".62" r=".58"><stop stop-color="#f7c37b" stop-opacity=".63"/><stop offset="1" stop-color="#f7c37b" stop-opacity="0"/></radialGradient>
 <linearGradient id="front" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#345668"/><stop offset="1" stop-color="#142d3d"/></linearGradient>
 <linearGradient id="ground" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#394c50"/><stop offset="1" stop-color="#0e222c"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1c8"/><stop offset="1" stop-color="#d28747"/></linearGradient>
 <linearGradient id="road" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fff3a8"/><stop offset=".5" stop-color="#ffc765"/><stop offset="1" stop-color="#d68536"/></linearGradient>
