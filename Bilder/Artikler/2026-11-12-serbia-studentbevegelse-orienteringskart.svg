<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="maptitle mapdesc">
<title id="maptitle">Hvor protestbevegelsen vokste fram: Novi Sad, Beograd og Niš</title>
<desc id="mapdesc">Skjematisk orienteringskart, ikke målestokkriktig. Novi Sad ligger nordvest for hovedstaden Beograd, mens Niš ligger lenger sørøst. Novi Sad var stedet for stasjonsulykken. Store studentdemonstrasjoner ble holdt i Beograd og Niš.</desc>
