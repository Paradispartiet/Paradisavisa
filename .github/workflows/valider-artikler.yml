name: Kontroller fortløpende artikler i Paradisavisa

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kontroll:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Valider enkeltartikler, bilder og nyhetsstrømmer
        run: node scripts/valider-artikler.cjs
      - name: Test sju originale redaksjonelle bilder og korrekt kategori
        run: node --test scripts/sju-artikkelbilder.test.cjs
      - name: Test felles artikkelmal, kildelinker og bildeutforming
        run: node --test scripts/artikkelmal.test.cjs
      - name: Test bankfeature-pilotens graf, kildedokumentasjon og moduler
        run: node --test scripts/bank-artikkel-levende.test.cjs
      - name: Test KI-debattens kilder, grafikk og interaktivitet
        run: node --test scripts/ki-debatt-levende.test.cjs
      - name: Test datasenterartikkelens MW-tall, kilder og levende moduler
        run: node --test scripts/datasentre-levende.test.cjs
      - name: Test Ronaldo-analysens dokumentasjon, fotballgrafikk og moduler
        run: node --test scripts/ronaldo-levende.test.cjs
      - name: Test Nationaltheatret-artikkelen, kildene og kulturmodulene
        run: node --test scripts/nationaltheatret-levende.test.cjs
      - name: Test kommentar om offentlige varer og tjenester
        run: node --test scripts/staten-varer-levende.test.cjs
      - name: Test digital suverenitet-feature med kilder og forklaringsmoduler
        run: node --test scripts/norden-digital-levende.test.cjs
      - name: Test Serbia-valgets sluttresultat og levende utenriksmoduler
        run: node --test scripts/serbia-studentvalg-levende.test.cjs
      - name: Test diplomatiforklaringen, kilder og moduler
        run: node --test scripts/diplomati-norge-russland-levende.test.cjs
      - name: Test tre nyhetssaker og eksakte WebP-originaler
        run: node --test scripts/tre-saker-2026-11-10.test.cjs
      - name: Test fire forsidekort og sideveis blaing
        run: node --test scripts/forside-scroll.test.cjs
      - name: Test ferskhet og arkivering av notiser
        run: node --test scripts/notiser.test.cjs
      - name: Test privat MP3-spiller, Media Session og utløpte nyheter
        run: node --test scripts/radio/mp3_preview_player.test.cjs
      - name: Test at HTTPS-mediesjekk bare bruker original lyd
        run: node --test scripts/radio/https_media_probe.test.cjs
      - name: Test intern norsk lydpilot uten nettverk eller stemmemodell
        run: python3 -m unittest discover -s scripts/radio -p "test_*.py" -v
      - name: Test redaksjonelle lenke- og notatsperrer
        run: node --test scripts/redaksjonelle-sperrer.test.cjs
      - name: Test isolert publiseringsløp
        run: node --test scripts/publiser-artikkel.test.cjs
      - name: Sjekk at ukontrollert utkast ikke kan publiseres
        run: |
          if node scripts/publiser-artikkel.cjs cyberrisiko 2026-10-31; then
            echo "Utkast ble tillatt publisert uten godkjenning"
            exit 1
          fi
          echo "Publiseringssperren er aktiv"

