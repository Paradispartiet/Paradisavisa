name: PR201 promote approved image (one-off)
on:
  push:
    branches:
      - redaksjon/2026-11-20-likestilling-gutter-menn
    paths:
      - .github/workflows/pr201-image-import.yml
permissions:
  contents: write
jobs:
  copy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy approved WebP to public article assets
        run: |
          set -euo pipefail
          source='utkast/2026-11-20/bilder/gutter-menn-likestilling-hovedbilde.webp'
          target='Bilder/Artikler/2026-11-20-likestilling-gutter-og-menn.webp'
          test -s "$source"
          mkdir -p Bilder/Artikler
          cp "$source" "$target"
          cmp "$source" "$target"
          python - <<'PY'
          from pathlib import Path
          b=Path("Bilder/Artikler/2026-11-20-likestilling-gutter-og-menn.webp").read_bytes()
          assert len(b)>10000 and b[:4]==b"RIFF" and b[8:12]==b"WEBP"
          print("Public WebP validated:",len(b))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --quiet || (git commit -m 'Add final equality article image to public assets' && git push)
