name: Bygg verifisert Trump-WSJ-fotomontasje

on:
  push:
    branches:
      - design/trump-wsj-fotomontasje-20261103
    paths:
      - .github/workflows/bygg-trump-wsj-fotomontasje.yml

permissions:
  contents: write

jobs:
  bygg-bilde:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Pillow
        run: python -m pip install --quiet Pillow
      - name: Last ned to offentlige fotografier og lag redaksjonell montasje
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, io, math
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageEnhance, ImageDraw, ImageFilter

          images = [
            ("https://commons.wikimedia.org/wiki/Special:FilePath/TrumpPortrait.jpg",
             "047ad63fa5bf785b565a50c8f8398192afa8a8f6", (2550,3300)),
            ("https://commons.wikimedia.org/wiki/Special:FilePath/Federal_Courthouse_in_Miami.jpg",
             "1f37bf021c2fe584390cb48ab2e840bd4e271977", (2576,1932))
          ]
          photos=[]
          for url, expected_sha1, dimensions in images:
              req=Request(url,headers={"User-Agent":"Paradisavisa/1.0 (https://github.com/Paradispartiet/Paradisavisa)"})
              with urlopen(req,timeout=75) as response:
                  data=response.read()
              actual=hashlib.sha1(data).hexdigest()
              if actual!=expected_sha1: raise SystemExit(f"Feil SHA1 for {url}: {actual}")
              im=Image.open(io.BytesIO(data)).convert("RGB")
              if im.size!=dimensions: raise SystemExit(f"Feil kildestørrelse {im.size} for {url}")
              photos.append(im)

          trump,court=photos
          SIZE=(1600,900)
          bg=ImageOps.fit(court,SIZE,method=Image.Resampling.LANCZOS,centering=(0.52,0.52))
          bg=ImageEnhance.Color(bg).enhance(0.75)
          bg=ImageEnhance.Contrast(bg).enhance(1.2)
          base=Image.blend(bg,Image.new("RGB",SIZE,(9,21,37)),0.50).convert("RGBA")

          # Ekte Trump-portrett i forgrunnen, med myk overgang til rettsbygningen.
          resized=trump.resize((780,1009),Image.Resampling.LANCZOS)
          portrait=Image.new("RGBA",SIZE,(0,0,0,0))
          portrait.paste(resized.convert("RGBA"),(8,-65))
          alpha=Image.new("L",SIZE,0)
          ap=alpha.load()
          for x in range(0,965):
              edge=1 if x<540 else max(0,(955-x)/415)
              for y in range(0,SIZE[1]):
                  vertical=1 if y<690 else max(.65,1-(y-690)/850)
                  ap[x,y]=int(255*edge*vertical)
          portrait.putalpha(alpha)
          base=Image.alpha_composite(base,portrait)

          # Separate lyskilder og mørkt nyhetsmagasin-uttrykk.
          atmosphere=Image.new("RGBA",SIZE,(0,0,0,0))
          d=ImageDraw.Draw(atmosphere)
          d.ellipse((1070,190,1690,870),fill=(227,132,52,85))
          d.ellipse((-450,-200,700,680),fill=(8,48,112,35))
          atmosphere=atmosphere.filter(ImageFilter.GaussianBlur(200))
          base=Image.alpha_composite(base,atmosphere)

          # Mørk gradient i bunnen gir ro og beskytter utsnittet på mobil.
          vignette=Image.new("RGBA",SIZE,(0,0,0,0))
          v=ImageDraw.Draw(vignette)
          for y in range(SIZE[1]):
              a=int(55*(y/(SIZE[1]-1))**2.2)
              v.line([(0,y),(SIZE[0],y)],fill=(4,8,18,a))
          base=Image.alpha_composite(base,vignette)
          out=base.convert("RGB")

          target=Path("Bilder/Artikler/trump-wsj-dom-fotomontasje-2026.jpg")
          target.parent.mkdir(parents=True,exist_ok=True)
          out.save(target,"JPEG",quality=89,optimize=True,subsampling=0)
          print(f"Verifisert to originale fotografier og lagret {target}, {target.stat().st_size} byte")
          PY
      - name: Lagre montasjen kun på arbeidsgrenen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Bilder/Artikler/trump-wsj-dom-fotomontasje-2026.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Legg til verifisert redaksjonell fotomontasje for Trump og WSJ"
          git push origin HEAD:refs/heads/design/trump-wsj-fotomontasje-20261103
