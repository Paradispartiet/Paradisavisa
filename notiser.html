<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notiser | Paradisavisa</title>

  <meta name="description" content="Notisarkivet i Paradisavisa – korte saker med opprinnelige publiseringsdatoer.">
  <meta property="og:title" content="Notiser | Paradisavisa">
  <meta property="og:description" content="Alle notiser fra Paradisavisa – korte nyheter i et levende grid.">
  <meta property="og:image" content="https://paradispartiet.github.io/Paradisavisa/og-image.PNG">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Paradisavisa">

  <link rel="icon" href="ikon-paradis.png">
  <link rel="stylesheet" href="styles.css?v=37">
  <link rel="stylesheet" href="avisdesign.css?v=5">
</head>
<body class="notiser-side">

  <div id="header-placeholder"><a href="index.html" class="avis-fallback-link">← Til Paradisavisa</a></div>
  <main id="hovedinnhold" class="arkiv-hoved notis-arkiv-hoved">
    <p class="arkiv-kategori">Paradisavisa / Korte nyheter</p>
    <h1>Notisarkiv</h1>
    <p class="arkiv-ingress">Her finner du dagens notiser og tidligere notiser fra notisbåndet. Hver notis beholder sin dato; arkiverte opplysninger er ikke nødvendigvis oppdaterte.</p>
    <div id="notisgrid" class="notisgrid" aria-label="Tidligere publiserte notiser"></div>
  </main>

  <footer class="site-footer">
    <p>© 2025–2026 Paradisavisa</p>
    <p>
      <a href="https://paradispartiet.github.io/Paradispartiet" target="_blank">Paradispartiet</a> ·
      <a href="https://paradispartiet.github.io/Teorien-om-lyset" target="_blank">Teorien om lyset</a>
    </p>
  </footer>

  <div class="notisbånd"><div class="notisinnhold"></div></div>

  <script defer src="script.js?v=30"></script>
  <script>
    // Arkivnotiser settes inn som tekst, aldri som ufiltrert HTML.
    Promise.all(["notiser.json", "arkiv/notiser-2025-10.json"].map(filename =>
      fetch(filename, { cache: "no-store" }).then(response => {
        if (!response.ok) throw new Error("Kunne ikke hente notisarkivet: " + filename);
        return response.json();
      })
    ))
      .then(groups => {
        const data = groups.flat();
        const grid = document.getElementById("notisgrid");
        if (!grid || !Array.isArray(data)) return;
        grid.replaceChildren();
        data.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")))
          .forEach((item, i) => {
            const card = document.createElement("article");
            card.className = "notis-rute " + ["liten", "mellom", "stor"][i % 3];
            const header = document.createElement("div");
            header.className = "notis-header";
            const category = document.createElement("span");
            category.className = "notis-kategori";
            category.textContent = String(item.category || "Notis");
            const date = document.createElement("time");
            date.className = "notis-dato";
            date.dateTime = String(item.date || "");
            date.textContent = String(item.date || "");
            const description = document.createElement("p");
            description.textContent = String(item.text || "");
            header.append(category, date);
            card.append(header, description);
            grid.appendChild(card);
          });
      })
      .catch(error => {
        console.error(error);
        const grid = document.getElementById("notisgrid");
        if (grid) grid.textContent = "Notisarkivet kunne ikke lastes. Prøv igjen senere.";
      });
  </script>
</body>
</html>
