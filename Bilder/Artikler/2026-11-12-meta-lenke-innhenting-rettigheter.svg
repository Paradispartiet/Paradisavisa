<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title description">
<title id="title">Tre ulike måter journalistisk innhold kan brukes på</title>
<desc id="description">Prinsippskisse som skiller lenkedeling, indeksering og mulig videre bruk av innhold etter avtaleklausuler. En lenke fra en redaksjon til en plattform gir ikke automatisk rett til å kopiere alt innhold på redaksjonens nettside. Meta bestrider at de foreslåtte klausulene utvider slike rettigheter, mens utgivere og jurister har uttrykt bekymring. Illustrasjonen dokumenterer ikke at Meta faktisk har hentet innhold.</desc>
<rect width="1000" height="640" rx="18" fill="#0d1115"/>
<g font-family="system-ui,sans-serif">
<text x="38" y="50" fill="#ffe5a0" font-size="27" font-weight="800">EN LENKE ER IKKE EN BLANKOFULLMAKT</text>
<text x="38" y="83" fill="#cfd6d4" font-size="17">Tre forskjellige handlinger – med forskjellige spørsmål om rettigheter</text>
<rect x="28" y="116" width="298" height="388" rx="11" fill="#1e302b" stroke="#95d4b7" stroke-width="3"/>
