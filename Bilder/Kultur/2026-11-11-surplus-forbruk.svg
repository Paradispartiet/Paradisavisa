<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="ttl desc">
<title id="ttl">Surplus – redaksjonell illustrasjon om forbrukersamfunnet</title>
<desc id="desc">Mørk grafisk kollasj med stiliserte kvitteringer, strekkoder og ordet SURPLUS. En original illustrasjon, ikke en scene fra filmen.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#171715"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <pattern id="bars" width="42" height="42" patternUnits="userSpaceOnUse">
    <rect x="3" width="2" height="42" fill="#fff" opacity=".22"/><rect x="12" width="7" height="42" fill="#fff" opacity=".18"/><rect x="25" width="3" height="42" fill="#fff" opacity=".2"/><rect x="34" width="1" height="42" fill="#fff" opacity=".18"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="35"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="985" cy="225" r="230" fill="#e9d04d" opacity=".12" filter="url(#glow)"/>
<g opacity=".25" transform="translate(875 15) rotate(13 160 280)">
  <rect x="0" y="0" width="310" height="590" fill="#ebebdf"/>
  <rect x="18" y="22" width="274" height="330" fill="url(#bars)"/>
  <rect x="32" y="385" width="220" height="8" fill="#171717"/>
  <rect x="32" y="411" width="160" height="8" fill="#171717"/>
  <rect x="32" y="440" width="260" height="40" fill="#171717"/>
  <rect x="32" y="505" width="210" height="6" fill="#171717"/>
</g>
<g opacity=".12" transform="translate(690 90) rotate(-14 100 210)">
 <rect width="200" height="490" fill="#fff"/>
 <rect x="15" y="18" width="170" height="395" fill="url(#bars)"/>
</g>
<rect x="70" y="86" width="100" height="6" fill="#f5d533"/>
<text x="70" y="132" fill="#f5d533" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" letter-spacing="5">FILMANBEFALING · 2003</text>
<text x="65" y="314" fill="#f3f0df" font-family="Arial Black,Arial,Helvetica,sans-serif" font-size="150" font-weight="900" letter-spacing="-9">SURPLUS</text>
<rect x="70" y="355" width="530" height="2" fill="#f5d533" opacity=".65"/>
<text x="70" y="409" fill="#f3f0df" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" letter-spacing="1">HVA ER NOK?</text>
<text x="70" y="454" fill="#c4c0b3" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing=".5">En film om reklame, begjær og forbruk</text>
<text x="70" y="595" fill="#f5d533" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PARADISAVISA / KULTUR</text>
</svg>
