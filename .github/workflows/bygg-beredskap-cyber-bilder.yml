name: Lag to redaksjonelle beredskapsbilder

on:
  push:
    branches:
      - design/beredskap-cyber-mobilbilder-20261103
    paths:
      - .github/workflows/bygg-beredskap-cyber-bilder.yml

permissions:
  contents: write

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer billedbehandling
        run: python -m pip install --quiet Pillow
      - name: Hent lisensierte originalfoto og produser hovedbilder
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps, ImageEnhance, ImageDraw, ImageFilter
          import hashlib

          sources={
              'security':('U.N. General Assembly 77 (52373180672).jpg',(4032,3024),'484acb10b4c4b05a0d1ade15f95ae44abeb29bfd'),
              'infrastructure':('UPS Power Management Module, racks with network cabling in NERSC data center.jpg',(4288,2848),None),
              'blackout':('A room during load shedding at night in West Bengal, India.jpg',(3264,2448),'e92fb672b515de41ac2c1036e4e97f15bfd427e1'),
              'radio':('DAB Radio 07.jpg',(3249,2384),None),
          }
          originals={}
          for key,(filename,expected_size,expected_hash) in sources.items():
              url='https://commons.wikimedia.org/wiki/Special:FilePath/'+quote(filename.replace(' ','_'),safe="'()")
              request=Request(url,headers={'User-Agent':'Paradisavisa/1.0 (https://github.com/Paradispartiet/Paradisavisa)'})
              with urlopen(request,timeout=90) as response:
                  raw=response.read()
              sha1=hashlib.sha1(raw).hexdigest()
              image=ImageOps.exif_transpose(Image.open(BytesIO(raw))).convert('RGB')
              if image.size not in (expected_size,expected_size[::-1]) or len(raw)<400000:
                  raise SystemExit(f'Originalkontroll feilet: {key}; {image.size}; {len(raw)}')
              if expected_hash and expected_hash!=sha1:
                  raise SystemExit(f'Forventet SHA1 stemmer ikke for {key}: {sha1}')
              originals[key]=image
              print(f'ORIGINAL {key}: {filename}; SHA1={sha1}; {image.size}; {len(raw)} byte')

          W,H=1600,900
          def fit(im,anchor=(.5,.5)):
              return ImageOps.fit(im,(W,H),method=Image.Resampling.LANCZOS,centering=anchor)
          def grade(im,color,mix=.13,contrast=1.18,saturation=.87,brightness=1.0):
              im=ImageEnhance.Brightness(im).enhance(brightness)
              im=ImageEnhance.Contrast(im).enhance(contrast)
              im=ImageEnhance.Color(im).enhance(saturation)
              im=Image.blend(im,Image.new('RGB',(W,H),color),mix)
              return ImageEnhance.Sharpness(im).enhance(1.20)

          def blend(left,right,edge,span=120):
              fg=right.convert('RGBA')
              mask=Image.new('L',(W,H))
              md=ImageDraw.Draw(mask)
              for x in range(W):
                  val=0 if x <= edge-span else 255 if x>=edge+span else round(255*(x-edge+span)/(span*2))
                  md.line((x,0,x,H),fill=val)
              fg.putalpha(mask.filter(ImageFilter.GaussianBlur(9)))
              return Image.alpha_composite(left.convert('RGBA'),fg)
          def finish(frame,accent=(184,53,50),location=(1260,380),power=.25):
              light=Image.new('RGBA',(W,H))
              ld=ImageDraw.Draw(light)
              x,y=location
              ld.ellipse((x-240,y-235,x+240,y+235),fill=(*accent,round(power*115)))
              light=light.filter(ImageFilter.GaussianBlur(115))
              frame=Image.alpha_composite(frame,light)
              vignette=Image.new('RGBA',(W,H),(0,0,0,0))
              vd=ImageDraw.Draw(vignette)
              for y in range(H):
                  vd.line((0,y,W,y),fill=(3,9,17,int(28*(y/H)**2.4)))
              return ImageEnhance.Sharpness(Image.alpha_composite(frame,vignette).convert('RGB')).enhance(1.08)
          def store(photo,name):
              path=Path('utkast')/name
              path.parent.mkdir(parents=True,exist_ok=True)
              photo.save(path,format='JPEG',quality=89,optimize=True,subsampling=0)
              if path.stat().st_size<140000:
                  raise SystemExit(f'Bildet for lite: {path.stat().st_size} bytes')
              print(f'BILDE {path} size={path.stat().st_size} SHA256={hashlib.sha256(path.read_bytes()).hexdigest()}')

          # Cyberfare: personell i et reelt, amerikansk sikkerhetssenter + fysisk datasenter.
          # Bildet påstår ikke å vise NSM, et angrep eller et bestemt norsk anlegg.
          people=grade(fit(originals['security'],(.57,.47)),(9,35,60),.16,contrast=1.19)
          hardware=grade(fit(originals['infrastructure'],(.30,.51)),(7,28,53),.20,contrast=1.23,brightness=.98)
          cyber=finish(blend(people,hardware,edge=880,span=120),(177,56,55),(1365,390),.28)
          store(cyber,'2026-10-28/bilder/cyberrisiko-sikkerhetssenter-2026.jpg')

          # Egenberedskap: faktisk mørklagt rom + konkret DAB-radio. Scener fra
          # forskjellige tidspunkter og steder, uten påstand om norsk strømbrudd.
          night=grade(fit(originals['blackout'],(.54,.53)),(31,21,39),.17,contrast=1.21,brightness=1.08)
          radio=grade(fit(originals['radio'],(.51,.46)),(67,37,14),.11,contrast=1.16,saturation=1.04)
          emergency=finish(blend(night,radio,edge=890,span=140),(241,141,59),(1165,570),.18)
          store(emergency,'2026-10-30/bilder/beredskap-dab-radio-mobilutfall-2026.jpg')
          PY
      - name: Lagre bilder kun på arbeidsgrenen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utkast/2026-10-28/bilder/cyberrisiko-sikkerhetssenter-2026.jpg utkast/2026-10-30/bilder/beredskap-dab-radio-mobilutfall-2026.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Produser to dokumenterte hovedbilder for cyber- og mobilberedskap"
          git push origin HEAD:refs/heads/design/beredskap-cyber-mobilbilder-20261103
